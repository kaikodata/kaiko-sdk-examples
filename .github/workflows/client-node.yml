name: client-node
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: lts/lithium # node 26
      - run: >
          cd node &&
          npm install &&
          npm run tsc
